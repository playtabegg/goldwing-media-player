# Dependency updates, weekly, grouped. Test on PR is the gate; pip-audit
# runs there too, so a known vulnerability in a pin is loud, not quiet.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
